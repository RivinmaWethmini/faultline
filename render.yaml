services:
  - type: web
    name: faultline-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: faultline-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: REDIS_OPTIONAL
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info

databases:
  - name: faultline-db
    plan: free
    databaseName: faultline
    user: faultline
